[package]
name = "glim-reader"
version = "0.9.1"
description = "A lightweight, fast, WYSIWYG Markdown desktop reader"
authors = ["Neilooo"]
license = "MIT"
homepage = "https://github.com/redtramp/glim"
repository = "https://github.com/redtramp/glim"
edition = "2021"

[lib]
name = "glim_reader_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-system-fonts = "2.0.2"
window-vibrancy = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
tauri-plugin-http = "2.8.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
