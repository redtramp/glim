name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: MSI + NSIS portable
          - platform: windows-latest
            args: ''
            rust-targets: ''
          # Ubuntu 22.04: AppImage + deb
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          # macOS: universal binary (Intel + Apple Silicon)
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      # 1. 拉代码
      - name: Checkout
        uses: actions/checkout@v5

      # 2. 安装 pnpm（关键：解决 pnpm not found）
      # 显式指定版本,与 package.json 的 packageManager(pnpm@11.17.0)保持一致
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      # 3. Node + pnpm cache（Node 22 消 warning）
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      # 4. Rust 工具链
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # 5. Rust 编译缓存（大幅加速）
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # 6. Linux 系统依赖（WebView2 替代：webkit2gtk 等）
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      # 7. 安装前端依赖（CI 必须用 frozen-lockfile）
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 8. 构建并发布到 GitHub Release
      - name: Build & publish (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Glim v__VERSION__'
          releaseBody: |
            ## Glim v__VERSION__

            See the assets below for your platform.

            - **Windows**: `.msi` installer or portable `.exe`
            - **macOS**: `.dmg` (universal, Intel + Apple Silicon)
            - **Linux**: `.AppImage` and `.deb`

            Full changelog: https://github.com/redtramp/glim/blob/main/CHANGELOG.md
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
