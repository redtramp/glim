name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # ← 关键，建 Release 必须

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            rust-targets: ''
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    # 不想写顶层就写这里，一样生效：
    # permissions:
    #   contents: write

    steps:
      - uses: actions/checkout@v5
      # ... 中间步骤不变 ...

      - name: Build & publish (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Glim v__VERSION__'
          releaseBody: |
            ## Glim v__VERSION__
            ...
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
